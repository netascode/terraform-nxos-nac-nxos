---
nxos: include('nxos', required=False)
defaults: any(required=False)
---

nxos:
  global: include('global', required=False)
  devices: list(include('devices'), required=False, primary_key='name')
  device_groups: list(include('device_groups'), required=False, primary_key='name')
  interface_groups: list(include('interface_groups'), required=False, primary_key='name')
  templates: list(include('nxos_templates'), required=False, primary_key='name')

global:
  variables: map(key=str(), required=False)
  configuration: include('device_configuration', required=False)
  templates: list(str(), required=False)

devices:
  name: str()
  url: str()
  managed: bool(required=False)
  device_groups: list(str(), required=False)
  variables: map(key=str(), required=False)
  configuration: include('device_configuration', required=False)
  templates: list(str(), required=False)
  cli_templates: list(include('nxos_cli_templates'), required=False, primary_key='name')

device_configuration:
  aaa: include('aaa', required=False)
  analytics: include('analytics', required=False)
  arp: include('arp', required=False)
  banner: include('banner', required=False)
  bfd: include('bfd', required=False)
  cdp: include('cdp', required=False)
  crypto: include('crypto', required=False)
  dhcp: include('dhcp', required=False)
  dns: include('dns', required=False)
  epbr: include('epbr', required=False)
  security_group: include('security_group', required=False)
  evpn: include('evpn', required=False)
  fabric_forwarding: include('fabric_forwarding', required=False)
  feature: include('feature', required=False)
  feature_set: include('feature_set', required=False)
  igmp: include('igmp', required=False)
  igmp_snooping: include('igmp_snooping', required=False)
  ip_access_lists: list(include('ip_access_lists'), required=False, primary_key='name')
  ipv6_access_lists: list(include('ipv6_access_lists'), required=False, primary_key='name')
  ip_as_path_access_lists: list(include('ip_as_path_access_lists'), required=False, primary_key='name')
  ip_community_lists: list(include('ip_community_lists'), required=False, primary_key='name')
  ip_extcommunity_lists: list(include('ip_extcommunity_lists'), required=False, primary_key='name')
  ip_large_community_lists: list(include('ip_large_community_lists'), required=False, primary_key='name')
  object_group: include('object_group', required=False)
  ip_prefix_lists: list(include('ip_prefix_lists'), required=False, primary_key='name')
  ipv6_prefix_lists: list(include('ipv6_prefix_lists'), required=False, primary_key='name')
  ip_sla: include('ip_sla', required=False)
  key_chains: list(include('key_chains'), required=False, primary_key='name')
  lacp: include('lacp', required=False)
  lldp: include('lldp', required=False)
  logging: include('logging', required=False)
  macsec: include('macsec', required=False)
  nd: include('nd', required=False)
  netflow: include('netflow', required=False)
  ntp: include('ntp', required=False)
  ptp: include('ptp', required=False)
  qos: include('qos', required=False)
  route_maps: list(include('route_maps'), required=False, primary_key='name')
  routing: include('routing', required=False)
  sflow: include('sflow', required=False)
  snmp: include('snmp', required=False)
  monitor_sessions: list(include('monitor_sessions'), required=False, primary_key='id')
  spanning_tree: include('spanning_tree', required=False)
  system: include('system', required=False)
  telemetry: include('telemetry', required=False)
  tracks: list(include('tracks'), required=False, primary_key='id')
  udld: include('udld', required=False)
  vlan: include('vlan', required=False)
  vpc: include('vpc', required=False)
  vrfs: list(include('vrfs'), required=False, primary_key='name')
  vtp: include('vtp', required=False)
  interfaces: include('interfaces', required=False)

device_groups:
  name: str()
  devices: list(str(), required=False)
  variables: map(key=str(), required=False)
  configuration: include('device_configuration', required=False)
  templates: list(str(), required=False)

interface_groups:
  name: str()
  configuration: include('interface_group_configuration', required=False)

nxos_templates:
  name: str()
  type: enum('model', 'file', 'cli')
  file: str(required=False)
  stage: enum('pre', 'post', required=False)
  order: int(min=0, max=9, required=False)
  content: str(required=False)
  configuration: include('device_configuration', required=False)

nxos_cli_templates:
  name: str()
  stage: enum('pre', 'post', required=False)
  order: int(min=0, max=9, required=False)
  content: str()

aaa:
  radius: include('aaa_radius', required=False)
  tacacs: include('aaa_tacacs', required=False)
  users: include('aaa_users', required=False)
  role_feature_groups: list(include('aaa_role_feature_groups'), required=False, primary_key='name')
  roles: list(include('aaa_roles'), required=False, primary_key='name')
  authentication: include('aaa_authentication', required=False)
  authorization: list(include('aaa_authorization'), required=False, primary_key='command_type')
  accounting: include('aaa_accounting', required=False)

aaa_radius:
  deadtime: any(int(min=0, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  key: str(required=False)
  key_encryption: any(enum('0', '6', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  retransmit: any(int(min=0, max=5), regex("^.*[\$\%]\{.*$"), required=False)
  secure: any(enum('tls', 'dtls'), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_type: any(enum('ethernet', 'loopback', 'mgmt', 'port-channel', 'vlan', 'vni'), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_id: any(str(), int(min=0), required=False)
  timeout: any(int(min=1, max=60), regex("^.*[\$\%]\{.*$"), required=False)
  test_idle_time: any(int(min=0, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  test_password: str(required=False)
  test_password_type: any(enum('0', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  test_username: str(required=False)
  servers: list(include('aaa_radius_servers'), required=False, primary_key='host')
  server_groups: list(include('aaa_radius_server_groups'), required=False, primary_key='name')

aaa_radius_servers:
  host: str()
  key: str(required=False)
  key_encryption: any(enum('0', '6', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  auth_port: any(int(min=0, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  acct_port: any(int(min=0, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  authentication: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  accounting: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  timeout: any(int(min=0, max=60), regex("^.*[\$\%]\{.*$"), required=False)
  retransmit: any(int(min=0, max=5), regex("^.*[\$\%]\{.*$"), required=False)
  test_idle_time: any(int(min=0, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  test_password: str(required=False)
  test_password_type: any(enum('0', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  test_username: str(required=False)
  tls_client_trustpoint: str(required=False)
  tls_idle_timeout: any(int(min=60, max=600), regex("^.*[\$\%]\{.*$"), required=False)
  dtls_client_trustpoint: str(required=False)
  dtls_idle_timeout: any(int(min=60, max=600), regex("^.*[\$\%]\{.*$"), required=False)

aaa_radius_server_groups:
  name: str()
  deadtime: any(int(min=0, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_type: any(enum('ethernet', 'loopback', 'mgmt', 'port-channel', 'vlan', 'vni'), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_id: any(str(), int(min=0), required=False)
  use_vrf: str(required=False)
  servers: list(include('aaa_radius_server_group_servers'), required=False, primary_key='host')

aaa_radius_server_group_servers:
  host: str()

aaa_tacacs:
  deadtime: any(int(min=0, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  key: str(required=False)
  key_encryption: any(enum('0', '6', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  retries: any(int(min=0, max=5), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_type: any(enum('ethernet', 'loopback', 'mgmt', 'port-channel', 'vlan', 'vni'), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_id: any(str(), int(min=0), required=False)
  timeout: any(int(min=1, max=60), regex("^.*[\$\%]\{.*$"), required=False)
  servers: list(include('aaa_tacacs_servers'), required=False, primary_key='host')
  server_groups: list(include('aaa_tacacs_server_groups'), required=False, primary_key='name')

aaa_tacacs_servers:
  host: str()
  test_authentication_protocol: any(enum('pap', 'chap', 'mschap', 'mschapv2', 'ascii'), regex("^.*[\$\%]\{.*$"), required=False)
  key: str(required=False)
  key_encryption: any(enum('0', '6', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  test_idle_time: any(int(min=0, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  test_password: str(required=False)
  test_password_type: any(enum('0', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  test_username: str(required=False)
  port: any(int(min=1, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  retries: any(int(min=0, max=5), regex("^.*[\$\%]\{.*$"), required=False)
  single_connection: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  timeout: any(int(min=0, max=60), regex("^.*[\$\%]\{.*$"), required=False)

aaa_tacacs_server_groups:
  name: str()
  deadtime: any(int(min=0, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_type: any(enum('ethernet', 'loopback', 'mgmt', 'port-channel', 'vlan', 'vni'), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_id: any(str(), int(min=0), required=False)
  use_vrf: str(required=False)
  servers: list(include('aaa_tacacs_server_group_servers'), required=False, primary_key='host')

aaa_users:
  password_strength_check: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  service_password_recovery: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  max_logins: any(int(min=0, max=7), regex("^.*[\$\%]\{.*$"), required=False)
  userpassphrase: include('aaa_users_userpassphrase', required=False)
  accounts: list(include('aaa_users_accounts'), required=False, primary_key='username')

aaa_users_userpassphrase:
  min_length: any(int(min=0, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  max_length: any(int(min=0, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  default_lifetime: any(int(min=0, max=99999), regex("^.*[\$\%]\{.*$"), required=False)
  default_gracetime: any(int(min=0, max=99999), regex("^.*[\$\%]\{.*$"), required=False)
  default_warntime: any(int(min=0, max=99999), regex("^.*[\$\%]\{.*$"), required=False)
  sequence_alphabet_length: any(int(min=0, max=10), regex("^.*[\$\%]\{.*$"), required=False)
  sequence_keyboard_length: any(int(min=0, max=10), regex("^.*[\$\%]\{.*$"), required=False)
  min_unique: any(int(min=0, max=10), regex("^.*[\$\%]\{.*$"), required=False)

aaa_users_accounts:
  username: str()
  expiration: str(required=False)
  expires: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  password: str(required=False)
  password_encryption_type: any(enum('0', '5', 'pbkdf2', 'scrypt'), regex("^.*[\$\%]\{.*$"), required=False)
  shelltype: any(enum('vsh', 'bash'), regex("^.*[\$\%]\{.*$"), required=False)
  sshkey: str(required=False)
  roles: list(include('aaa_users_accounts_roles'), required=False, primary_key='name')

aaa_users_accounts_roles:
  name: str()

aaa_role_feature_groups:
  name: str()
  features: list(str(), required=False)

aaa_roles:
  name: str()
  description: str(required=False)
  rules: list(include('aaa_roles_rules'), required=False, primary_key='number')
  vlan_policy: include('aaa_roles_vlan_policy', required=False)
  interface_policy: include('aaa_roles_interface_policy', required=False)
  vrf_policy: include('aaa_roles_vrf_policy', required=False)

aaa_roles_rules:
  number: any(int(min=1, max=256), regex("^.*[\$\%]\{.*$"))
  action: any(enum('permit', 'deny'), regex("^.*[\$\%]\{.*$"))
  permission: any(enum('read', 'read-write'), regex("^.*[\$\%]\{.*$"), required=False)
  command: str(required=False)
  feature: str(required=False)
  feature_group: str(required=False)
  oid: str(required=False)

aaa_roles_vlan_policy:
  deny: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  permit_vlans: include('general_vlans', required=False)

aaa_roles_interface_policy:
  deny: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  permit_interfaces: list(include('aaa_roles_interface_policy_permit_interfaces'), required=False, primary_key='interface_type,interface_id')

aaa_roles_interface_policy_permit_interfaces:
  interface_type: any(enum('ethernet', 'loopback', 'mgmt', 'port-channel'), regex("^.*[\$\%]\{.*$"))
  interface_id: any(str(), int(min=0))

aaa_roles_vrf_policy:
  deny: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  permit_vrfs: list(str(), required=False)

aaa_tacacs_server_group_servers:
  host: str()
  order: any(int(min=0, max=16), regex("^.*[\$\%]\{.*$"), required=False)

aaa_authentication:
  default_role: any(enum('no-login', 'assign-default-role'), regex("^.*[\$\%]\{.*$"), required=False)
  radius_directed_request: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  tacacs_directed_request: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_default_groups: any(list(str()), regex("^.*[\$\%]\{.*$"), required=False)
  login_default_fallback: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_default_local: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_default_none: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_default_error_enable: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_default_invalid_username_log: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_console_groups: any(list(str()), regex("^.*[\$\%]\{.*$"), required=False)
  login_console_fallback: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_console_local: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_console_none: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_console_error_enable: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  login_console_invalid_username_log: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

aaa_authorization:
  command_type: any(enum('config-commands', 'commands'), regex("^.*[\$\%]\{.*$"))
  groups: any(list(str()), regex("^.*[\$\%]\{.*$"), required=False)
  none: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  local: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

aaa_accounting:
  groups: any(list(str()), regex("^.*[\$\%]\{.*$"), required=False)
  none: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  local: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

analytics:
  shutdown: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  flow_timeout: any(int(min=5, max=60), regex("^.*[\$\%]\{.*$"), required=False)
  flow_profiles: list(include('analytics_flow_profiles'), required=False, primary_key='name')
  flow_events: list(include('analytics_flow_events'), required=False, primary_key='name')
  flow_filters: list(include('analytics_flow_filters'), required=False, primary_key='name')
  flow_records: list(include('analytics_flow_records'), required=False, primary_key='name')
  flow_exporters: list(include('analytics_flow_collectors'), required=False, primary_key='name')
  flow_monitors: list(include('analytics_flow_monitors'), required=False, primary_key='name')
  flow_system_config: include('analytics_flow_system_config', required=False)
  flow_traffic_analytics: include('analytics_flow_traffic_analytics', required=False)

analytics_flow_records:
  name: str()
  collect: list(any(enum('count-bytes', 'count-pkts', 'sampler-id', 'pkt-disp', 'ts-first', 'ts-recent', 'tcp-flags', 'src-intf', 'ingress-vrf-id'), str()), required=False)
  match: list(any(enum('ethertype', 'dst-mac', 'src-mac', 'vlan', 'proto', 'tos', 'src-ipv4', 'dst-ipv4', 'src-ipv6', 'dst-ipv6', 'src-port', 'dst-port', 'src-ip', 'dst-ip'), str()), required=False)

analytics_flow_collectors:
  name: str()
  description: str(required=False)
  destination: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  transport_udp: any(int(min=0, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  dscp: any(int(min=0, max=63), regex("^.*[\$\%]\{.*$"), required=False)
  events_transport_udp: any(int(min=0, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  inband_interface: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  source_address: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_type: any(enum('ethernet', 'loopback', 'mgmt', 'port-channel', 'vlan', 'vni'), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_id: any(str(), int(min=0), required=False)
  v9: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  version: any(enum('v5', 'v9', 'cisco-v1'), regex("^.*[\$\%]\{.*$"), required=False)
  vrf: str(required=False)

analytics_flow_monitors:
  name: str()
  record: str(required=False)
  exporter_bucket_ids: list(include('analytics_flow_monitors_exporter_buckets'), required=False, primary_key='id')

analytics_flow_monitors_exporter_buckets:
  id: any(int(min=1, max=255), regex("^.*[\$\%]\{.*$"))
  hash_high: any(int(min=0, max=4294967295), regex("^.*[\$\%]\{.*$"), required=False)
  hash_low: any(int(min=0, max=4294967295), regex("^.*[\$\%]\{.*$"), required=False)
  exporters: list(str(), required=False)

analytics_flow_system_config:
  direction: any(enum('in', 'out', 'both'), regex("^.*[\$\%]\{.*$"), required=False)
  exporter_id: any(int(min=0, max=4294967295), regex("^.*[\$\%]\{.*$"), required=False)
  switch_latency: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  traffic_analytics: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  monitor: str(required=False)
  profile: str(required=False)
  event: str(required=False)
  filter: str(required=False)

analytics_flow_profiles:
  name: str()
  burst_interval_shift: any(int(min=0, max=255), regex("^.*[\$\%]\{.*$"), required=False)
  collect_interval: any(int(min=100, max=64000), regex("^.*[\$\%]\{.*$"), required=False)
  ip_packet_id_shift: any(int(min=0, max=255), regex("^.*[\$\%]\{.*$"), required=False)
  mtu: any(int(min=576, max=9216), regex("^.*[\$\%]\{.*$"), required=False)
  seq_num_guess_threshold_high: any(int(min=0, max=4294967295), regex("^.*[\$\%]\{.*$"), required=False)
  seq_num_guess_threshold_low: any(int(min=0, max=4294967295), regex("^.*[\$\%]\{.*$"), required=False)
  source_port: any(int(min=1, max=65535), regex("^.*[\$\%]\{.*$"), required=False)

analytics_flow_events:
  name: str()
  capture_acl_drops: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  capture_blackhole: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  capture_buffer_drops: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  capture_fwd_drops: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  capture_ip_df: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  capture_receive_window_zero: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  capture_tos: any(int(min=0, max=255), regex("^.*[\$\%]\{.*$"), required=False)
  capture_ttl: any(int(min=0, max=255), regex("^.*[\$\%]\{.*$"), required=False)
  event_export_max: any(int(min=0, max=32000), regex("^.*[\$\%]\{.*$"), required=False)
  group_drop_events: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  group_latency_events: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  group_packet_events: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  latency_threshold: any(int(min=0, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  latency_threshold_unit: any(enum('micro-sec', 'milli-sec'), regex("^.*[\$\%]\{.*$"), required=False)

analytics_flow_filters:
  name: str()
  ipv4_acl: str(required=False)
  ipv6_acl: str(required=False)
  ce_acl: str(required=False)

analytics_flow_traffic_analytics:
  name: str(required=False)
  db_size: any(int(min=1, max=5000), regex("^.*[\$\%]\{.*$"), required=False)
  filter_export_interval: any(int(min=10, max=60), regex("^.*[\$\%]\{.*$"), required=False)
  mode_interface: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  udp_port: any(int(min=0, max=65535), regex("^.*[\$\%]\{.*$"), required=False)

arp:
  timeout: any(int(min=0, max=28800), regex("^.*[\$\%]\{.*$"), required=False)
  cache_limit: any(int(min=1, max=614400), regex("^.*[\$\%]\{.*$"), required=False)
  cache_syslog_rate: any(int(min=1, max=1000), regex("^.*[\$\%]\{.*$"), required=False)
  cache_intf_limit: any(int(min=0, max=128000), regex("^.*[\$\%]\{.*$"), required=False)
  adjacency_route_distance: any(int(min=2, max=250), regex("^.*[\$\%]\{.*$"), required=False)
  cos: any(int(min=0, max=7), regex("^.*[\$\%]\{.*$"), required=False)
  off_list_timeout: any(int(min=180, max=1800), regex("^.*[\$\%]\{.*$"), required=False)
  evpn_timeout: any(int(min=2000, max=30000), regex("^.*[\$\%]\{.*$"), required=False)
  suppression_timeout: any(int(min=0, max=28800), regex("^.*[\$\%]\{.*$"), required=False)
  allow_static_arp_outside_subnet: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
